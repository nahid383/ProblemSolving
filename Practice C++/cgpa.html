<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <style>
        /* Reset and base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* Layout classes */
        .min-h-screen { min-height: 100vh; }
        .max-w-4xl { max-width: 56rem; margin: 0 auto; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mt-4 { margin-top: 1rem; }
        
        /* Background and colors */
        .bg-gradient-to-br { background: linear-gradient(to bottom right, #eff6ff, #e0e7ff); }
        .bg-white { background-color: white; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .bg-blue-600 { background-color: #2563eb; }
        .bg-blue-700 { background-color: #1d4ed8; }
        .bg-red-500 { background-color: #ef4444; }
        .bg-red-600 { background-color: #dc2626; }
        .bg-gradient-to-r { background: linear-gradient(to right, #f0fdf4, #eff6ff); }
        
        /* Text colors */
        .text-gray-800 { color: #1f2937; }
        .text-gray-700 { color: #374151; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-500 { color: #6b7280; }
        .text-white { color: white; }
        .text-blue-600 { color: #2563eb; }
        
        /* Text sizes and weights */
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        
        /* Layout */
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-md { border-radius: 0.375rem; }
        .rounded { border-radius: 0.25rem; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        
        /* Grid and flex */
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .gap-4 { gap: 1rem; }
        .flex { display: flex; }
        .items-end { align-items: flex-end; }
        
        /* Form elements */
        .w-full { width: 100%; }
        .block { display: block; }
        .border { border-width: 1px; }
        .border-gray-300 { border-color: #d1d5db; }
        .focus\:outline-none:focus { outline: none; }
        .focus\:ring-2:focus { box-shadow: 0 0 0 2px #3b82f6; }
        .focus\:ring-blue-500:focus { box-shadow: 0 0 0 2px #3b82f6; }
        
        /* Buttons */
        .hover\:bg-blue-700:hover { background-color: #1d4ed8; }
        .hover\:bg-red-600:hover { background-color: #dc2626; }
        .hover\:bg-gray-50:hover { background-color: #f9fafb; }
        .transition { transition-property: all; transition-duration: 200ms; }
        
        /* Table */
        .overflow-x-auto { overflow-x: auto; }
        .border-collapse { border-collapse: collapse; }
        
        /* Responsive */
        @media (min-width: 768px) {
            .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        
        /* Custom input and select styles */
        input, select {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        button {
            cursor: pointer;
            border: none;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        
        th, td {
            border: 1px solid #d1d5db;
            padding: 0.5rem 1rem;
        }
        
        th {
            background-color: #f3f4f6;
            font-weight: 600;
        }
        
        tr:hover {
            background-color: #f9fafb;
        }

</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📊 CGPA Calculator</h1>
            <p class="text-gray-600">Calculate your semester CGPA easily</p>
        </div>

        <!-- Main Container -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <!-- Add Course Form -->
            <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Add Course</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Course Name</label>
                        <input type="text" id="courseName" placeholder="e.g., Mathematics" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Credit Hours</label>
                        <input type="number" id="creditHours" placeholder="3" min="1" max="6"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Grade</label>
                        <select id="grade" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Grade</option>
                            <option value="4.0">A+ (4.0)</option>
                            <option value="4.0">A (4.0)</option>
                            <option value="3.7">A- (3.7)</option>
                            <option value="3.3">B+ (3.3)</option>
                            <option value="3.0">B (3.0)</option>
                            <option value="2.7">B- (2.7)</option>
                            <option value="2.3">C+ (2.3)</option>
                            <option value="2.0">C (2.0)</option>
                            <option value="1.7">C- (1.7)</option>
                            <option value="1.3">D+ (1.3)</option>
                            <option value="1.0">D (1.0)</option>
                            <option value="0.0">F (0.0)</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="addCourse()" 
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                            Add Course
                        </button>
                    </div>
                </div>
            </div>

            <!-- Courses Table -->
            <div class="mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Your Courses</h2>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse border border-gray-300 rounded-lg">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 px-4 py-2 text-left">Course Name</th>
                                <th class="border border-gray-300 px-4 py-2 text-center">Credit Hours</th>
                                <th class="border border-gray-300 px-4 py-2 text-center">Grade</th>
                                <th class="border border-gray-300 px-4 py-2 text-center">Grade Points</th>
                                <th class="border border-gray-300 px-4 py-2 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="coursesTable">
                            <tr id="emptyRow">
                                <td colspan="5" class="border border-gray-300 px-4 py-8 text-center text-gray-500">
                                    No courses added yet. Add your first course above!
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- CGPA Result -->
            <div class="bg-gradient-to-r from-green-50 to-blue-50 rounded-lg p-6 text-center">
                <h2 class="text-2xl font-semibold text-gray-800 mb-2">Your CGPA</h2>
                <div class="text-5xl font-bold text-blue-600 mb-2" id="cgpaResult">0.00</div>
                <div class="text-gray-600">
                    <span>Total Credit Hours: </span>
                    <span id="totalCredits" class="font-semibold">0</span>
                </div>
                <button onclick="clearAll()" 
                        class="mt-4 bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-6 rounded-md transition duration-200">
                    Clear All Courses
                </button>
            </div>
        </div>
    </div>

    <script>
        let courses = [];
        let courseCounter = 0;

        function addCourse() {
            const courseName = document.getElementById('courseName').value.trim();
            const creditHours = parseInt(document.getElementById('creditHours').value);
            const grade = parseFloat(document.getElementById('grade').value);
            const gradeText = document.getElementById('grade').selectedOptions[0].text;

            // Validation
            if (!courseName) {
                alert('Please enter a course name');
                return;
            }
            if (!creditHours || creditHours < 1 || creditHours > 6) {
                alert('Please enter valid credit hours (1-6)');
                return;
            }
            if (isNaN(grade)) {
                alert('Please select a grade');
                return;
            }

            // Add course to array
            const course = {
                id: courseCounter++,
                name: courseName,
                credits: creditHours,
                grade: grade,
                gradeText: gradeText,
                gradePoints: creditHours * grade
            };
            courses.push(course);

            // Clear form
            document.getElementById('courseName').value = '';
            document.getElementById('creditHours').value = '';
            document.getElementById('grade').value = '';

            // Update display
            updateCoursesTable();
            calculateCGPA();
        }

        function updateCoursesTable() {
            const tableBody = document.getElementById('coursesTable');
            
            if (courses.length === 0) {
                tableBody.innerHTML = `
                    <tr id="emptyRow">
                        <td colspan="5" class="border border-gray-300 px-4 py-8 text-center text-gray-500">
                            No courses added yet. Add your first course above!
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = courses.map(course => `
                <tr class="hover:bg-gray-50">
                    <td class="border border-gray-300 px-4 py-2">${course.name}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">${course.credits}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">${course.gradeText}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">${course.gradePoints.toFixed(1)}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">
                        <button onclick="removeCourse(${course.id})" 
                                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition duration-200">
                            Remove
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function removeCourse(courseId) {
            courses = courses.filter(course => course.id !== courseId);
            updateCoursesTable();
            calculateCGPA();
        }

        function calculateCGPA() {
            if (courses.length === 0) {
                document.getElementById('cgpaResult').textContent = '0.00';
                document.getElementById('totalCredits').textContent = '0';
                return;
            }

            const totalGradePoints = courses.reduce((sum, course) => sum + course.gradePoints, 0);
            const totalCredits = courses.reduce((sum, course) => sum + course.credits, 0);
            const cgpa = totalGradePoints / totalCredits;

            document.getElementById('cgpaResult').textContent = cgpa.toFixed(2);
            document.getElementById('totalCredits').textContent = totalCredits;
        }

        function clearAll() {
            if (courses.length === 0) return;
            
            if (confirm('Are you sure you want to clear all courses?')) {
                courses = [];
                updateCoursesTable();
                calculateCGPA();
            }
        }

        // Allow Enter key to add course
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addCourse();
            }
        });
    </script>
